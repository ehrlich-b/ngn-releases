[package]
name = "ngn-k4-sample"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "=1.0.102"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sfbinpack = "=0.6.4"
sha2 = "=0.10.9"

[[bin]]
name = "ngnk4scan"
path = "src/bin/scan.rs"

[[bin]]
name = "ngnk4select"
path = "src/bin/select.rs"

[[bin]]
name = "ngnk4sampleverify"
path = "src/bin/verify.rs"

[[bin]]
name = "ngnk4archive"
path = "src/bin/archive.rs"
