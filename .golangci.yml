# golangci-lint configuration for ngn chess engine
# Documentation: https://golangci-lint.run/usage/configuration/

run:
  # Timeout for analysis
  timeout: 5m
  
  # Exit code when at least one issue was found
  issues-exit-code: 1
  
  # Include test files in analysis
  tests: true
  
  # List of build tags for analysis
  build-tags: []

# Output configuration
output:
  # Format options
  formats:
    - format: colored-line-number
  
  # Print lines of code with issue
  print-issued-lines: true
  
  # Print linter name in issue line
  print-linter-name: true

# Linters configuration
linters:
  # Enable specific linters
  enable:
    # Default linters
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify Go code
    - govet         # Go vet tool
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Go static analysis
    - typecheck     # Type checking
    - unused        # Find unused code
    
    # Additional linters for code quality
    - gofmt         # Format checker
    - goimports     # Import management
    - misspell      # Spell checker
    - unparam       # Find unused function parameters
    - unconvert     # Remove unnecessary type conversions
    - gocyclo       # Cyclomatic complexity
    - dupl          # Code duplication
    - goconst       # Find repeated strings that could be constants
    - gocognit      # Cognitive complexity
    - prealloc      # Find slice declarations that could be pre-allocated
    - gosec         # Security checker
    - copyloopvar   # Check for loop variable capture bugs (replaces exportloopref)
    - nolintlint    # Lint nolint directives
    
    # Performance linters
    - bodyclose     # Check HTTP response body is closed
    - rowserrcheck  # Check SQL rows.Err
    - sqlclosecheck # Check SQL Close calls
    
    # Style linters (less strict for development)
    - gocritic      # Go critique
    - whitespace    # Whitespace issues
  
  # Disable specific linters
  disable:
    - exhaustive    # Too strict for chess engine enum handling
    - forcetypeassert  # We handle type assertions carefully
    - godot         # Comments don't need periods in all cases
    - lll           # Line length can be flexible
    - nlreturn      # Not critical for readability
    - testpackage   # Tests in same package are fine
    - paralleltest  # Not all tests need to be parallel
    - tparallel     # Parallel tests not required everywhere
    - cyclop        # We use gocyclo instead
    - funlen        # Function length can be flexible for chess logic
    - maintidx      # Maintainability index too strict
    - gofumpt       # gofmt is sufficient
    - revive        # We use other linters for similar checks
    - stylecheck    # Too opinionated for our naming
    - varnamelen    # Variable name length can be context-dependent
    - wsl           # Whitespace linter too strict for chess engine

# Linters settings
linters-settings:
  # Cyclomatic complexity
  gocyclo:
    min-complexity: 15  # Higher threshold for chess logic
  
  # Cognitive complexity  
  gocognit:
    min-complexity: 20  # Higher threshold for chess algorithms
    
  # Duplication threshold
  dupl:
    threshold: 100  # Allow some duplication for chess patterns
  
  # Misspelling
  misspell:
    locale: US
  
  # Go security
  gosec:
    excludes:
      - G404  # Random number generation (acceptable for Zobrist hashing)
  
  # Go critique
  gocritic:
    enabled-tags:
      - diagnostic
      - performance  
      - style
    disabled-checks:
      - commentedOutCode  # Commented code can be useful during development
      - whyNoLint        # Not all nolint needs explanation during dev
      - unnamedResult    # Unnamed results are fine for simple functions
      - hugeParam        # Large structs by value are sometimes necessary
      
  # Error checking
  errcheck:
    # Check type assertions
    check-type-assertions: true
    # Check blank assignments  
    check-blank: false
    
  # Unused parameters
  unparam:
    check-exported: false  # Don't check exported functions for unused params
    
  # Whitespace linter
  wsl:
    strict-append: false
    allow-assign-and-call: true
    allow-multiline-assign: true
    
  # Pre-allocation
  prealloc:
    simple: true
    range-loops: true
    for-loops: false

# Issues configuration
issues:
  # Maximum issues count per linter
  max-issues-per-linter: 50
  
  # Maximum count of issues with same text
  max-same-issues: 3
  
  # Show only new issues created after git revision
  new: false
  
  # Make issues output unique by line
  uniq-by-line: true
  
  # Exclude directories
  exclude-dirs:
    - build/
  
  # Independently of option `exclude` field, exclude issues from templates.
  exclude-use-default: false
  
  # Exclude specific issues
  exclude:
    # Exclude some staticcheck messages
    - "SA9003:"  # Empty body in if statement
    # Exclude G115 integer overflow warnings for chess engine (mostly false positives)
    - "G115:"    # Integer overflow conversion warnings
    
  # Exclude issues by path
  exclude-rules:
    # Exclude magic number checks in test files
    - path: _test\.go
      linters:
        - goconst
        - dupl
        - gosec
    
    # Allow longer lines in generated code
    - path: ".*\\.pb\\.go"
      linters:
        - lll
    
    # Less strict linting for main.go (entry point)
    - path: main\.go
      linters:
        - gocyclo
        - gocognit
        
    # Allow complexity in chess engine core functions
    - path: engine/.*\.go
      linters:
        - gocyclo
        - gocognit
      text: "(makeMoveHelper|IsDraw|Move|updateHash)"
        
  # Fix issues automatically when possible
  fix: false

severity:
  # Default severity for issues
  default-severity: error
  
  # Rules for different severities
  rules:
    - linters:
        - misspell
        - whitespace
        - gofmt
        - goimports
      severity: warning